<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="抗生素助手">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>抗生素選擇助手</title>
<style>
/* Layout: 處方箋式雙欄 — 左欄病人卡（腎功能、過敏、懷孕）固定，右欄分頁決策流程；劑量以等寬字突出，可直接抄寫醫囑 */
:root{
  --bg:#edf1f0; --surface:#ffffff; --surface2:#f5f8f7; --ink:#13201d; --muted:#596a66; --line:#d3ddda;
  --accent:#0a6a5f; --accent-ink:#ffffff; --accent-weak:#dbeee9;
  --warn:#8f5400; --warn-bg:#fcefd8; --danger:#ae2a20; --danger-bg:#fae4e1;
  --ok:#1d7344; --ok-bg:#def2e6; --info:#2a5a86; --info-bg:#e3edf7;
  --f-body:"IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,Menlo,Consolas,monospace;
  --s3:#1d6b45; --s3-ink:#ffffff; --s2:#9ccf72; --s2-ink:#14301c; --s1:#f0c64a; --s1-ink:#3a2c00; --s0:#d9534f; --s0-ink:#ffffff;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#151f1d; --surface2:#1a2624; --ink:#e1ebe8; --muted:#94a6a1; --line:#2a3a37;
  --accent:#4dc0ae; --accent-ink:#04201b; --accent-weak:#163933;
  --warn:#f2b45c; --warn-bg:#382810; --danger:#ff8b80; --danger-bg:#3b1a17;
  --ok:#6fd39a; --ok-bg:#142e1e; --info:#93bde6; --info-bg:#16283a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#151f1d; --surface2:#1a2624; --ink:#e1ebe8; --muted:#94a6a1; --line:#2a3a37;
  --accent:#4dc0ae; --accent-ink:#04201b; --accent-weak:#163933;
  --warn:#f2b45c; --warn-bg:#382810; --danger:#ff8b80; --danger-bg:#3b1a17;
  --ok:#6fd39a; --ok-bg:#142e1e; --info:#93bde6; --info-bg:#16283a; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:1260px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
.brand h1{font-size:1.45rem;font-weight:700;letter-spacing:.01em}
.brand .sub{color:var(--muted);font-size:.85rem}
.ver{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.disc{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:9px 14px;font-size:.86rem;margin-bottom:16px}
.disc b{font-weight:600}

.cols{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:920px){.cols{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:14px}
@media (max-width:920px){.side{position:static}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label,.lbl{font-size:.8rem;color:var(--muted)}
.field input:not([type=radio]):not([type=checkbox]),.field select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);font:inherit;font-family:var(--f-mono);font-size:.95rem}
.field select{font-family:var(--f-body)}
.unit{font-size:.75rem;color:var(--muted)}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;margin:0}
.seg label{position:relative}
.seg label,.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 12px;font-size:.86rem;cursor:pointer;user-select:none;line-height:1.35}
.seg input:checked+span{color:var(--accent-ink)}
.seg label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:.5;cursor:not-allowed}
.chip .n{font-family:var(--f-mono);font-size:.75rem;opacity:.75;margin-right:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.rsum{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--accent-weak)}
.rsum .big{font-family:var(--f-mono);font-size:1.25rem;font-weight:600}
.rsum .small{font-size:.8rem;color:var(--muted)}
.rsum.empty{background:var(--warn-bg);color:var(--warn)}
.rsum.arc{background:var(--info-bg)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--accent)}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;cursor:pointer;font-size:.82rem;text-decoration:underline}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:none}
.tab{background:none;border:0;padding:9px 12px;font-size:.93rem;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

.step{margin-bottom:18px}
.step>h3{font-size:.95rem;font-weight:600;margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.step>h3 .k{font-family:var(--f-mono);font-size:.78rem;color:var(--accent)}
.hint{font-size:.82rem;color:var(--muted);margin-top:6px}

details.mdr{margin-top:8px}
details summary{cursor:pointer;font-size:.86rem;color:var(--accent)}
.mdrlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 14px;margin-top:8px}

.ctx{background:var(--info-bg);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:.88rem;margin-bottom:14px}
.ctx b{color:var(--info)}

.paths{display:flex;flex-wrap:wrap;gap:6px}
.res{display:grid;gap:12px}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.opt.primary{border-left:4px solid var(--accent)}
.opt-head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px}
.tier{font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:6px;background:var(--surface2);border:1px solid var(--line)}
.tier.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tier.po{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tier.add,.tier.esc{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tier.allergy{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.pick,.plus{font-size:.76rem;color:var(--muted);letter-spacing:.04em;margin:4px 0}
.plus{color:var(--warn);font-weight:600}
.formula{background:var(--accent-weak);border-radius:8px;padding:8px 10px;font-size:.92rem;margin-bottom:6px}
.fhint{color:var(--muted);font-size:.8rem;margin-left:4px}
.sep{font-size:.76rem;color:var(--muted);font-weight:600;margin:0}
.plan{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface2)}
.plan-h{font-size:.84rem;font-weight:600;color:var(--accent);padding:2px 0 4px}
.pick{text-align:left}
.rx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-top:1px dashed var(--line)}
.rx:first-of-type{border-top:0}
.rx-head{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;min-width:0}
.rx-name{font-weight:600}
.brandbtn{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.brand{font-size:.78rem;background:var(--info-bg);color:var(--info);border-radius:6px;padding:1px 8px}
.route{font-family:var(--f-mono);font-size:.72rem;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.rx-dose{grid-column:1/2;font-family:var(--f-mono);font-size:.98rem;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.rx-dose .w{font-weight:400;color:var(--muted);font-size:.85rem}
.rx-meta{grid-column:1/2;font-size:.8rem;color:var(--muted)}
.rx .copy{grid-column:2/3;grid-row:1/3;align-self:start;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:3px 9px;font-size:.78rem;cursor:pointer}
.rx.blocked .rx-name,.rx.blocked .rx-dose{text-decoration:line-through;text-decoration-color:var(--danger);opacity:.65}
.adj{color:var(--warn);font-weight:600}
.flag{font-size:.72rem;padding:1px 7px;border-radius:999px;line-height:1.5}
.flag.danger{background:var(--danger-bg);color:var(--danger)}
.flag.warn{background:var(--warn-bg);color:var(--warn)}
.flag.ok{background:var(--ok-bg);color:var(--ok)}
.flag.info{background:var(--info-bg);color:var(--info)}
details.ix{grid-column:1/-1;font-size:.82rem}
details.ix ul{margin:4px 0 0;padding-left:18px}
.cond,.onote{font-size:.84rem;margin-top:6px}
.cond{color:var(--warn)}
.srcs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.src{font-size:.7rem;font-family:var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;cursor:help}
.upd{font-size:.7rem;font-weight:700;color:var(--ok);background:var(--ok-bg);border-radius:4px;padding:1px 6px;letter-spacing:.03em}

.notes{display:grid;gap:8px}
.note{font-size:.88rem;padding:9px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.note.warn{background:var(--warn-bg);border-color:transparent}
.note.danger{background:var(--danger-bg);border-color:transparent}
.dur{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.dur .k{font-size:.78rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.dur .v{font-weight:600}
.sec-title{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 0 2px}

.tgt{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tgt h3{font-size:1.02rem;font-style:italic}
.tgt .pnote{font-size:.86rem;color:var(--muted);margin:4px 0 10px}

.favs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.fav{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.82rem}
.fav button{background:none;border:0;cursor:pointer;padding:4px 10px}
.fav button+button{padding:4px 9px 4px 0;color:var(--muted)}
.btn{border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:.86rem;cursor:pointer}
.btn.solid{background:var(--accent);color:var(--accent-ink)}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.76rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
.sev{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap}
.sev.x{background:var(--danger-bg);color:var(--danger)}
.sev.h{background:var(--warn-bg);color:var(--warn)}
.sev.m{background:var(--info-bg);color:var(--info)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);font-weight:600}
.reflist{font-size:.86rem;padding-left:18px}
.reflist li{margin-bottom:6px}
.reflist b{font-family:var(--f-mono);font-size:.78rem}
.sus{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.sus .seg label{padding:2px 10px}

.dot{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:.7rem;font-weight:700;font-family:var(--f-mono);line-height:1}
.dot.s3{background:var(--s3);color:var(--s3-ink)} .dot.s2{background:var(--s2);color:var(--s2-ink)}
.dot.s1{background:var(--s1);color:var(--s1-ink)} .dot.s0{background:var(--s0);color:var(--s0-ink)}
.tbl-wrap.spec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.grid{width:auto;min-width:100%}
table.grid th,table.grid td{text-align:center;padding:3px 4px;border-bottom:0}
table.grid .stick{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;border-right:1px solid var(--line)}
table.grid thead th{position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line)}
table.grid thead th.stick{z-index:3}
table.grid tr.gap td{height:8px;padding:0}
table.grid tr.sel th,table.grid tr.sel td{background:var(--accent-weak)}
table.grid td.hl{background:var(--accent-weak)}
table.grid.cmp th.cmph{font-size:.72rem;font-weight:600;white-space:normal;min-width:58px;max-width:90px;line-height:1.25;vertical-align:bottom}
table.grid.cmp tbody th{vertical-align:middle}
table.grid.cmp tr.xrow th,table.grid.cmp tr.xrow td{border-top:1px dashed var(--line)}
.cellbtn{background:none;border:0;padding:2px;cursor:pointer;border-radius:50%;line-height:0}
.cellbtn[aria-pressed="true"] .dot{outline:2px solid var(--accent);outline-offset:2px}
.cmpsum div+div{margin-top:4px}
.colbtn,.rowbtn{background:none;border:0;cursor:pointer;font:inherit;color:var(--ink)}
.colbtn{font-size:.72rem;padding:4px 3px;border-radius:6px;white-space:nowrap}
.colbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rowbtn{font-size:.84rem;padding:2px 4px;text-align:left;white-space:nowrap}
.rowbtn:hover,.colbtn:hover{text-decoration:underline}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.82rem;margin:10px 0 4px}
.legend .dot{width:22px;height:22px;margin-right:2px}
.jump{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.88rem;z-index:20}
.muted{color:var(--muted)}
.mt{margin-top:10px}
@media (prefers-reduced-motion:no-preference){.chip,.tab,.seg label{transition:background .12s,color .12s,border-color .12s}}

/* v0.7 精簡介面 */
.disc{display:flex;gap:8px 12px;align-items:flex-start;justify-content:space-between}
.disc .linkbtn{color:var(--warn);white-space:nowrap;flex:none}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-h h2{margin-bottom:10px}
.ptbar{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;cursor:pointer;font-size:.9rem}
.ptbar .lab{font-size:.78rem;color:var(--muted);flex:none}
.ptbar .val{flex:1;min-width:0;font-family:var(--f-mono);font-weight:600;overflow-wrap:anywhere}
.ptbar .act{flex:none;font-size:.82rem;color:var(--accent)}
.ptbar.empty{background:var(--warn-bg);border-color:transparent}
.ptbar.empty .val{color:var(--warn);font-family:var(--f-body);font-weight:500}
.mmore{margin-top:6px}
.ptbody{display:flex;flex-direction:column;gap:14px}
.picked{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:12px;font-size:.95rem}
.picked .k{font-family:var(--f-mono);font-size:.78rem;color:var(--accent)}
.picked .q{color:var(--muted);font-size:.86rem}
.picked b{font-weight:600}
.rtag{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
button.flag{border:0;cursor:pointer;font:inherit;font-size:.76rem;padding:2px 9px}
.step>h3 .flag{font-weight:500}
.step>h3 .act{margin-left:auto;font-weight:400}
.rx-more{grid-column:1/2;font-size:.8rem;color:var(--muted);display:grid;gap:2px}
.rx-more .brand{justify-self:start}
details.more{border-top:1px solid var(--line);padding-top:8px}
details.more>summary{font-size:.86rem}
details.more>.notes,details.more>.paths,details.more>.ctx{margin-top:8px}
.dgrp+.dgrp{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.dg-h{font-size:.74rem;color:var(--muted);letter-spacing:.04em;margin-bottom:5px}
details.pathsel{border-top:0;padding-top:0;margin:-6px 0 18px}
details.pathsel>summary{font-size:.92rem}
.srcs .linkbtn{font-size:.74rem;margin-left:2px}
button.src,button.upd{font:inherit;cursor:pointer}
button.src{font-family:var(--f-mono);font-size:.7rem;background:none;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
button.upd{font-size:.7rem;font-weight:700;color:var(--ok);background:var(--ok-bg);border:0;border-radius:4px;padding:1px 6px;letter-spacing:.03em}
.top .brand{background:none;color:inherit;padding:0;border-radius:0;font-size:inherit}
@media (max-width:920px){.tab{padding:9px 8px}}
.tab .ts{display:none}
@media (max-width:420px){.tab .ts{display:inline}.tab .ts~.tl{display:none}}
@media (max-width:359px){.tab{padding:9px 5px}.morebtn .mcur{display:none}.morebtn .mgen{display:inline}}
.morebtn .mgen{display:none}
.tab.xtra{display:none}
@media (min-width:921px){.tab.xtra{display:inline-block}.tab.morebtn,.tabmenu{display:none!important}}
.tabmenu{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 14px}
.foot{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);display:grid;gap:4px}
.foot .ver{font-size:.74rem}
.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.ov .sheet{background:var(--surface);color:var(--ink);width:100%;max-width:720px;max-height:70vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));font-size:.9rem}
.ov .sheet h3{font-size:.95rem;font-family:var(--f-mono);margin-bottom:8px}
.ov .sheet p{margin:0 0 10px;overflow-wrap:anywhere}
.ov .sheet .btn{margin-top:4px}
/* v0.9–v0.12 */
.srch{position:relative;margin-bottom:8px}
.srch input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-size:.92rem}
.qres{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:25;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.16);max-height:60vh;overflow:auto;padding:6px}
.qcat{font-size:.72rem;color:var(--muted);letter-spacing:.06em;padding:6px 8px 2px}
.qitem{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;cursor:pointer;font-size:.92rem}
.qitem:hover,.qitem:focus-visible{background:var(--accent-weak)}
.qsub{font-size:.76rem;color:var(--muted)}

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>抗生素選擇助手</h1>
      <div class="sub">成人經驗性與標靶抗生素、劑量依腎功能調整</div>
    </div>
    <div class="ver" id="ver"></div>
  </header>
  <div class="disc" id="disc"><span><b>僅供臨床參考。</b>最終處方以院內規範、院內 antibiogram、藥師與感染科意見為準。本頁不儲存任何病人資料。</span><button class="linkbtn" type="button" data-act="disc-ok">知道了</button></div>

  <div class="cols">
    <aside class="side" id="side">
      <button class="ptbar" type="button" id="ptBar" data-act="pt-open" aria-expanded="false" aria-controls="ptBody" hidden></button>
      <div id="ptBody" class="ptbody">
      <section class="card" id="ptPanel">
        <div class="card-h"><h2>病人與腎功能</h2><span><button class="linkbtn" type="button" data-act="clear-all">清除全部</button>　<button class="linkbtn" type="button" data-act="pt-close">收合</button></span></div>
        <div class="grid2">
          <div class="field"><label for="age">年齡</label><input id="age" type="number" inputmode="numeric" min="18" max="110" placeholder="歲"></div>
          <div class="field"><span class="lbl">性別</span>
            <div class="seg" role="radiogroup" aria-label="性別">
              <label><input type="radio" name="sex" id="sexM" value="M" checked><span>男</span></label>
              <label><input type="radio" name="sex" id="sexF" value="F"><span>女</span></label>
            </div>
          </div>
          <div class="field"><label for="wt">體重 <span class="unit">kg</span></label><input id="wt" type="number" inputmode="decimal" min="20" max="300" placeholder="kg"></div>
          <div class="field"><label for="ht">身高 <span class="unit">cm</span></label><input id="ht" type="number" inputmode="decimal" min="120" max="230" placeholder="cm"></div>
          <div class="field"><label for="scr">SCr <span class="unit">mg/dL</span></label><input id="scr" type="number" inputmode="decimal" step="0.01" min="0.1" max="20" placeholder="mg/dL"></div>
        </div>
        <div class="field mt"><span class="lbl">腎功能評估方式</span>
          <div class="seg" role="radiogroup" aria-label="腎功能評估方式">
            <label><input type="radio" name="method" value="cg" checked><span>CG 自動計算</span></label>
            <button class="chip" type="button" id="mMoreBtn" data-act="m-more" aria-expanded="false" aria-controls="mMore">其他方式 ▾</button>
          </div>
          <div class="seg mmore" id="mMore" role="radiogroup" aria-label="其他腎功能評估方式" hidden>
            <label><input type="radio" name="method" value="crcl"><span>輸入 CrCl</span></label>
            <label><input type="radio" name="method" value="egfr"><span>輸入 eGFR</span></label>
            <label><input type="radio" name="method" value="hd"><span>HD</span></label>
            <label><input type="radio" name="method" value="pd"><span>PD</span></label>
            <label><input type="radio" name="method" value="crrt"><span>CRRT</span></label>
          </div>
        </div>
        <div class="field mt" id="crclRow" hidden><label for="crclIn">CrCl <span class="unit">mL/min</span></label><input id="crclIn" type="number" inputmode="decimal" min="0" max="250"></div>
        <div class="field mt" id="egfrRow" hidden><label for="egfrIn">eGFR <span class="unit">mL/min/1.73m²</span></label><input id="egfrIn" type="number" inputmode="decimal" min="0" max="250"></div>
        <label class="chk mt"><input type="checkbox" id="aki"><span>腎功能不穩定（AKI、Cr 快速變化）</span></label>
        <div id="rsum" class="rsum empty"></div>
      </section>

      <section class="card">
        <h2>過敏與懷孕</h2>
        <div class="field"><label for="allergy">β-lactam 過敏史</label>
          <select id="allergy">
            <option value="none">無</option>
            <option value="pen_low">Penicillin 過敏（非嚴重：皮疹、久遠、不明）</option>
            <option value="pen_ana">Penicillin 過敏性休克／IgE 型</option>
            <option value="ceph">Cephalosporin 過敏</option>
            <option value="bl_scar">任何 β-lactam 嚴重皮膚反應（SJS/TEN/DRESS）</option>
          </select>
        </div>
        <details class="pf mt" id="pfDet"><summary>PEN-FAST 評估（自述 penicillin 過敏）</summary>
          <div class="pfq">
            <label class="chk"><input type="checkbox" id="pf5"><span>反應距今 ≤5 年（2 分）</span></label>
            <label class="chk"><input type="checkbox" id="pfA"><span>過敏性休克或血管性水腫（2 分）</span></label>
            <label class="chk"><input type="checkbox" id="pfS"><span>嚴重皮膚不良反應 SCAR（SJS／TEN、DRESS、AGEP）</span></label>
            <label class="chk"><input type="checkbox" id="pfT"><span>當時需要治療（1 分）</span></label>
            <div class="hint">過敏性休克／血管性水腫與 SCAR 同一項，最多 2 分。</div>
          </div>
          <div id="pfRes" class="pfres"></div>
        </details>
        <label class="chk mt"><input type="checkbox" id="preg"><span>懷孕（標示孕期禁忌／需謹慎之藥物）</span></label>
      </section>

      <section class="card">
        <h2>肝功能（選填）</h2>
        <div class="seg" role="radiogroup" aria-label="Child-Pugh 輸入方式">
          <label><input type="radio" name="cpmode" value="calc" checked><span>計算 Child-Pugh</span></label>
          <label><input type="radio" name="cpmode" value="direct"><span>直接選分級</span></label>
        </div>
        <div id="cpCalc" class="mt">
          <div class="grid2">
            <div class="field"><label for="cpBili">Bilirubin <span class="unit">mg/dL</span></label><input id="cpBili" type="number" inputmode="decimal" step="0.1" min="0" max="50"></div>
            <div class="field"><label for="cpAlb">Albumin <span class="unit">g/dL</span></label><input id="cpAlb" type="number" inputmode="decimal" step="0.1" min="0" max="7"></div>
            <div class="field"><label for="cpInr">INR</label><input id="cpInr" type="number" inputmode="decimal" step="0.1" min="0.5" max="15"></div>
            <div class="field"><label for="cpAsc">腹水</label><select id="cpAsc"><option value="1">無</option><option value="2">輕度</option><option value="3">中重度</option></select></div>
            <div class="field"><label for="cpEnc">肝腦病變</label><select id="cpEnc"><option value="1">無</option><option value="2">1–2 級</option><option value="3">3–4 級</option></select></div>
          </div>
        </div>
        <div id="cpDirect" class="field mt" hidden><label for="cpCls">Child-Pugh 分級</label><select id="cpCls"><option value="">未評估</option><option value="A">A（5–6 分）</option><option value="B">B（7–9 分）</option><option value="C">C（10–15 分）</option></select></div>
        <div id="cpRes" class="rsum empty"></div>
      </section>
      </div>
    </aside>

    <main>
      <div class="srch"><input id="q" type="search" placeholder="搜尋：藥名、商品名、診斷、菌種、手術" autocomplete="off" aria-label="搜尋" aria-controls="qres"><div id="qres" class="qres" hidden></div></div>
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <div id="tabmenu" class="tabmenu" hidden></div>
      <div id="main"></div>
    </main>
  </div>
  <footer class="foot" id="foot"><div id="footDisc" hidden><b>僅供臨床參考。</b>最終處方以院內規範、院內 antibiogram、藥師與感染科意見為準。本頁不儲存任何病人資料。</div><div class="ver" id="footVer"></div></footer>
</div>

const num = v=>{const n=parseFloat(v);return Number.isFinite(n)?n:null};

function weights(){

}
function calcCG(){

function fillW(t){

    return ` ≈ ${mg} mg（以${k==="AG"?w.ds:"實際體重"} ${r0(kg)} kg 計）`;

function bandRange(b,i){

/* Vancomycin：一室模型（Matzke 1984）首劑估算 */
function vancoCalc(){
  const w=weights();
  if(!w) return {err:"請先輸入體重。"};
  if(R && R.mode!=="crcl") return {dial:R.mode,w};
  if(!R) return {err:"請輸入年齡、性別、體重與 SCr（或直接輸入 CrCl）。",w};
  const crcl=Math.min(Math.max(R.val,0),150);
  const CL=(0.689*crcl+3.66)*0.06; const Vd=0.7*w.tbw; const k=CL/Vd; const th=0.693/k;
  const tau= th<7?8 : th<12?12 : th<24?24 : 48;
  const r250=x=>Math.max(250,Math.round(x/250)*250);
  let dose=r250(S.vauc*CL*tau/24); let capped=false;
  if(dose>2000){dose=2000;capped=true;}
  const ld=Math.min(3000,r250(S.vld*w.tbw));
  const auc=dose*24/tau/CL;
  const tinf=Math.max(1,dose/1000);
  const cmax=(dose/tinf)*(1-Math.exp(-k*tinf))/(Vd*k*(1-Math.exp(-k*tau)));
  const cmin=cmax*Math.exp(-k*(tau-tinf));
  return {w,crcl,CL,Vd,k,th,tau,dose,ld,auc,cmin,cmax,capped};
}
function vancoBrief(){
  const v=vancoCalc();
  if(v.dial){
    const t={hd:"首劑 25 mg/kg（最多 3 g），之後每次透析後 5–10 mg/kg；依透析前濃度調整",pd:"首劑 20–25 mg/kg，之後依濃度補充（會診藥師）",crrt:"首劑 20–25 mg/kg，之後 7.5–10 mg/kg q12h，依濃度調整"}[v.dial];
    return {plain:t,html:t,band:`${R.label}劑量`,adj:true};
  }
  if(v.err){ const t="首劑 20–35 mg/kg（重症 25–30），之後 15–20 mg/kg q8–12h，依 AUC 400–600 調整"; return {plain:t,html:t,band:"輸入腎功能與體重後可估算",adj:false}; }
  const t=`首劑 ${v.ld} mg，之後 ${v.dose} mg IV q${v.tau}h`;
  return {plain:t,html:t+' <span class="w">（估算 AUC ≈ '+r0(v.auc)+'；見「TDM」頁）</span>',band:"一室模型估算，需依濃度調整",adj:v.tau>12};
}

  if(g==="ent"&&cur==="ESBL") h+=`<div class="note mt">${UPD} Piperacillin-tazobactam：膀胱炎已用且改善可不換；cUTI 可作替代（非重症、無菌血症）；泌尿道外感染即使感受也不建議。Cefepime 不建議（膀胱炎已用且改善可不換）。${srcTags(["IDSA_AMR24"])}</div>`;
  return h+`</div>`;
}

function regOK(rid,org,ph){ const d=REG[rid].d; if(S.cur.sus[d]==="R") return false; const i=intrinsic(d,org,ph); return !(i&&i.lvl==="bad"); }
function curEval(tlist){
  const C=S.cur; const out=[]; const org=C.org&&C.org!=="neg"?C.org:null;
  const g=org?PATH[org].g:null; const phs=g&&PHL[g]?Object.keys(PHL[g]):["any"]; const ph=org?(phs.includes(C.ph)?C.ph:phs[0]):null;
  const poReady=C.afeb&&C.stable&&C.po&&C.resp==="improve";
  if(!C.drugs.length) out.push(`<div class="note">先在上方點選目前使用的抗生素。</div>`);
  const bad=[];
  if(C.drugs.length){
    const rows=C.drugs.map(d=>{
      let st="info", m="尚無培養，暫時無法判斷";
      if(org){ const i=intrinsic(d,org,ph);
        if(C.sus[d]==="R"){st="danger";m="藥敏抗藥";bad.push(d);}
        else if(i&&i.lvl==="bad"){st="danger";m=i.m;bad.push(d);}
        else if(i&&i.lvl==="warn"){st="warn";m=i.m;}
        else if(C.sus[d]==="S"){st="ok";m="藥敏感受";}
        else {st="info";m="未填藥敏";}
      } else if(C.org==="neg"){ st="info"; m="培養陰性：依臨床反應判斷"; }
      const al=allergyCheck(d);
      return `<div class="rx"><div class="rx-head">${nameHTML(d)}<span class="flag ${st}">${m}</span>${al&&al.lvl==="danger"?`<span class="flag danger">${al.m}</span>`:""}</div></div>`;
    }).join("");
    out.push(`<div class="opt"><div class="opt-head"><span class="tier">目前用藥評估</span></div>${rows}</div>`);
  }
  if(org&&tlist.length){
    const ivC=[], poC=[];
    tlist.forEach(o=>o.regs.forEach(r=>{ if(regOK(r,org,ph)){ const rt=REG[r].r; if(rt.includes("PO")) poC.push(r); if(rt.includes("IV")||rt==="IM") ivC.push(r);} }));
    const best=(poReady&&poC.length)?poC[0]:(ivC[0]||poC[0]);
    const curMax=Math.max(0,...C.drugs.map(d=>D[d].rank));
    if(bad.length&&best){
      out.push(optCard(O("需更換",[best],{note:`${bad.map(d=>D[d].n).join("、")} 對此菌無效。`,src:["IDSA_AMR24"]})));
    } else if(best&&C.drugs.length&&curMax>D[REG[best].d].rank&&!C.drugs.includes(REG[best].d)){
      out.push(optCard(O("可降階",[best],{note:"目前用藥抗菌譜較廣，可依藥敏改為較窄效藥物",src:["IDSA_cUTI25"]})));
    } else if(best&&!C.drugs.length){
      out.push(optCard(O("建議",[best],{src:["IDSA_AMR24"]})));
    } else if(C.drugs.length) out.push(`<div class="note">目前用藥已對症，抗菌譜適當。</div>`);
    if(poReady){
      const po=[...new Set(poC)];
      out.push(po.length?optCard(Object.assign(O("口服降階",po.slice(0,4)),{note:"已符合 IV 轉口服條件",src:["IDSA_cUTI25","ATS19"]})):`<div class="note warn">已符合轉口服條件，但沒有感受的口服藥，請續用 IV 或會診感染科。</div>`);
    }
  } else if(!org){
    if(C.drugs.length&&C.resp!=="improve"&&C.day>=2){
      const lines=C.drugs.filter(d=>ESC[d]).map(d=>`<li><b>${D[d].n}</b>：${ESC[d]}</li>`).join("");
      const chk = siteClass(S.sub)==="resp"
        ? "重新評估診斷（肺栓塞、心衰竭、結核、黴菌）；找併發症（膿胸、肺膿瘍）；送痰與血液培養、肺炎鏈球菌與 Legionella 尿液抗原；確認劑量依腎功能是否偏低"
        : "影像排除阻塞或膿瘍（需引流）；更換導尿管後重新採檢；送尿液與血液培養；確認劑量依腎功能是否偏低；考慮非感染原因";
      out.push(`<div class="opt"><div class="opt-head"><span class="tier esc">48–72 小時${C.resp==="worse"?"惡化":"無改善"}</span></div><div class="onote"><b>先找原因再升階：</b>${chk}。</div>${lines?`<div class="onote"><b>升階方向：</b><ul>${lines}</ul></div>`:""}${srcTags(["EAU_UI26","ATS19"])}</div>`);
    } else if(C.drugs.length&&C.resp==="improve"){
      out.push(`<div class="note">${C.org==="neg"?"培養陰性但臨床改善：續用目前治療，依療程停藥；":"等待培養期間臨床改善："}${poReady?"已符合 IV 轉口服條件。"+(siteClass(S.sub)==="resp"?"CAP 可改 amoxicillin-clavulanate 或 cefuroxime ＋ doxycycline／azithromycin，或呼吸道 FQ（排除 TB 後）。":"UTI 無培養時，口服藥選擇需參考先前培養或院內 antibiogram。"):"尚未符合 IV 轉口服條件。"}</div>`);
    }
  }
  if(C.drugs.some(d=>d==="vanco"||d==="teico"||d==="linezolid")){
    if(org&&org!=="saur") out.push(`<div class="note">培養未見 S. aureus：若無其他 MRSA 證據，可停 vancomycin／teicoplanin／linezolid。</div>`);
    else if(!org&&siteClass(S.sub)==="resp") out.push(`<div class="note">MRSA 鼻腔 PCR 陰性時，MRSA 肺炎可能性低（陰性預測值高），可考慮停用。${srcTags(["PARENTE18"])}</div>`);
  }
  if(C.drugs.includes("piptazo")&&C.drugs.includes("vanco")) out.push(`<div class="note warn">Vancomycin ＋ piperacillin-tazobactam：急性腎損傷風險增加，監測 Cr。</div>`);
  const c={fx:fxSet(),sev:hasSev(S.sub)?S.sev:"none",male:S.pt.sex==="M"};
  const dur=GEN[S.sub](c).dur;
  const rem = dur.days? Math.max(0,dur.days-C.day):null;
  out.push(`<div class="dur"><span class="k">療程</span><span class="v">${dur.t}</span>${dur.days?`<span class="muted">已用 ${C.day} 天，依最短療程約剩 ${rem} 天</span>`:""}${srcTags(dur.src)}</div>`);
  return out.join("");
}

function teicoCalc(ind){

function teicoBrief(ind){

function oralSiteOK(rid,sub){
  const d=REG[rid].d;
  if(["nitrofurantoin","fosfomycin"].includes(d)||rid==="flu200") return sub==="cys"||sub==="cand_uti";
  if(d==="moxi"&&URI.includes(sub)) return false;
  if(["dapto","tige"].includes(d)) return false;
  return true;
}
function filterOral(list,sub,org,ph){
  const sus=S.oral.sus; const out=[];
  list.forEach(o=>{
    const ok=r=>{ const d=REG[r].d; if(sus[d]==="R") return false; if(!oralSiteOK(r,sub)) return false; if(org){ const i=intrinsic(d,org,ph); if(i&&i.lvl==="bad") return false; } return true; };
    const regs=o.regs.filter(ok);
    const add=(o.add||[]).map(g=>Object.assign({},g,{regs:g.regs.filter(ok)}));
    if(!regs.length||add.some(g=>!g.regs.length)) return;
    if(o.alt===false&&regs.length<o.regs.length) return;
    out.push(Object.assign({},o,{regs,add,alt:o.alt===false?false:regs.length>1}));
  });
  const ssti=["cell","abscess","dfi","ssti_unk","bite","water"].includes(sub);
  out.sort((a,b)=>{ const sc=x=>(x.regs.some(r=>sus[REG[r].d]==="S")?2:0)+(ssti&&x.regs.includes("lexSSTI")?1:0); return sc(b)-sc(a); });
  return out;
}

    <button class="chip" type="button" data-act="o-org" data-v="" aria-pressed="${O2.org===""}">無培養（經驗性口服）</button>

    if(site.poet){ poetMode=true; list=POET[g==="strep"||g==="gas"||g==="spn"?"strep":g+"_"+ph]||[]; }

    const drugs=[...new Set(list.flatMap(o=>[...o.regs,...(o.add||[]).flatMap(a=>a.regs)]).map(r=>REG[r].d))];
    if(drugs.length) h+=`<div class="lbl mt">口服藥藥敏（只需填報告上有的）</div><div class="sus">${drugs.map(d=>`<span>${D[d].n}</span><div class="seg">${[["","未知"],["S","S"],["R","R"]].map(([v,n])=>`<button class="chip" type="button" data-act="o-sus" data-d="${d}" data-v="${v}" aria-pressed="${(O2.sus[d]||"")===v}">${n}</button>`).join("")}</div>`).join("")}</div>`;

  // 05 建議
  h+=`<div class="step"><h3><span class="k">05</span>口服降階建議</h3>${renalBar()}<div class="res mt">`;

const GLOSS_KEYS = Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
const reEsc = s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
// 不用 lookbehind（舊版 iOS 不支援）
const GLOSS_SRC = "(^|[^A-Za-z0-9\\-])("+GLOSS_KEYS.map(reEsc).join("|")+")(?![A-Za-z0-9\\-])";
const GL_CARD = ".opt,.note,.dur,.ctx,.tgt,.hint,.formula,.cond,.onote,.rx-meta,.rx-more,li,td,.picked,.pfres";
function markGloss(root){
  if(!root||typeof document==="undefined") return;
  root.querySelectorAll(GL_CARD).forEach(card=>{
    if(card.parentElement&&card.parentElement.closest(GL_CARD)) return;   // 只處理最外層卡片：每張卡片第一次出現的縮寫
    const seen=new Set();
    const tw=document.createTreeWalker(card,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("button,summary,.rx-dose,input,select,textarea,i")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    const nodes=[]; while(tw.nextNode()) nodes.push(tw.currentNode);
    for(const n of nodes){
      const t=n.nodeValue, re=new RegExp(GLOSS_SRC,"g"); let m, last=0, changed=false; const frag=document.createDocumentFragment();
      while((m=re.exec(t))){
        const k=m[2], st=m.index+m[1].length;
        if(seen.has(k)) continue;
        seen.add(k); changed=true;
        frag.append(t.slice(last,st));
        const b=document.createElement("button"); b.type="button"; b.className="gl"; b.dataset.gl=k; b.textContent=k; frag.append(b);
        last=st+k.length;
      }
      if(changed){ frag.append(t.slice(last)); n.replaceWith(frag); }
    }
  });
}

function buildIdx(){

  for(const k of Object.keys(D)) add({t:"藥物",n:D[k].n,s:(D[k].n+" "+(D[k].brand||"")).toLowerCase(),sub:D[k].brand?`商品名：${D[k].brand}`:"",go:{tab:"drug",drug:k}});
  for(const [sk,sy] of Object.entries(SYS)) for(const u of sy.subs) add({t:"診斷",n:u.n,s:(u.n+" "+sy.n).toLowerCase(),sub:sy.n,go:{tab:"emp",sys:sk,sub:u.id}});
  SPC_FULL.forEach((n,i)=>add({t:"菌種",n,s:(n+" "+SPC[i]).toLowerCase(),sub:"抗菌譜",go:{tab:"spec",col:i}}));
  for(const [p,o] of Object.entries(PATH)) if(PCOL[p]!==undefined) add({t:"菌種",n:o.n,s:o.n.toLowerCase(),sub:`抗菌譜：${SPC[PCOL[p]]}`,go:{tab:"spec",col:PCOL[p]}});

  TDM_D.forEach(([k,n])=>add({t:"TDM",n:`${n}（TDM）`,s:(n+" tdm 濃度 劑量").toLowerCase(),sub:"劑量與濃度",go:{tab:"tdm",tdm:k}}));

function agCalc(){
  const a=S.ag, out={};

    if(a.t2<=a.t1) return {err:"第二次抽血時間要晚於第一次"};
    if(a.c2>=a.c1) return {err:"第二次濃度要低於第一次（同一給藥間隔內）"};
    if(a.t1<a.ti) return {err:"第一次抽血要在輸注結束後"};
    const K=Math.log(a.c1/a.c2)/(a.t2-a.t1), th=Math.log(2)/K, cmax=a.c1*Math.exp(K*(a.t1-a.ti));

  return out;

  }
  if(dial){
    h+=`<div class="opt"><div class="opt-head"><span class="tier">${R.label}</span></div>
      <div class="onote"><b>HD：</b>${X.hd}</div><div class="onote"><b>CRRT：</b>${X.crrt}</div><div class="onote"><b>PD：</b>依濃度給藥（會診藥師）</div>

  h+=`</div></div>`;
  // 03 濃度計算
  const a=S.ag, c=agCalc();
  const inp=(f,l,u,v,st)=>`<div class="field"><label for="ag_${f}">${l} <span class="unit">${u}</span></label><input id="ag_${f}" type="number" inputmode="decimal" step="${st}" min="0" data-act="ag-f" data-v="${f}" value="${v??""}"></div>`;

// 濃度判讀結果（輸入時只重繪這一塊，不打斷輸入）
function agResHTML(key){
  const X=AGX[key], a=S.ag, c=agCalc(); let h="";
  if(!c) h+=`<div class="note">輸入濃度後顯示判讀。</div>`;
  else if(c.err) h+=`<div class="note warn">${c.err}</div>`;
  else if(!c.two){
    const s0=X.ei[0], s1=X.ei[1];
    const inWin=a.t1>=6&&a.t1<=14;
    h+=`<div class="note${inWin?"":" warn"}">${inWin?"":"<b>抽血時間不在 6–14 小時內：</b>nomogram 不適用，請再輸入一點濃度用藥動計算。<br>"}Hartford（${s0.mk} mg/kg）：標到 nomogram 的值 = ${f1(a.c1/s0.div)} mg/L（${a.t1??"?"} 小時）${s0.div>1?`（原始濃度 ÷${s0.div}）`:""}。<br>Urban-Craig（${s1.mk} mg/kg）：${f1(a.c1/s1.div)} mg/L${s1.div>1?`（÷${s1.div}）`:""}。${srcTags(["STAN_AG","HHS_AG"])}</div>`;
  } else {
    const at=t=>c.cmax*Math.exp(-c.K*(t-a.ti));
    const tt=a.ti+Math.log(c.cmax/X.trough)/c.K;
    const q=[24,36,48].find(x=>x>=tt);
    h+=`<div class="opt primary"><div class="opt-head"><span class="tier primary">藥動估算</span></div>
      <dl class="kv"><dt>消除速率 K</dt><dd>${f2(c.K)} /h</dd><dt>半衰期</dt><dd>${f1(c.th)} h</dd><dt>輸注結束時 Cmax</dt><dd>${f1(c.cmax)} mg/L</dd>
      <dt>24 h／36 h／48 h 濃度</dt><dd>${[24,36,48].map(t=>f2(Math.max(0,at(t)))).join("／")} mg/L</dd><dt>降到 &lt;${X.trough} mg/L</dt><dd>約 ${f1(tt)} h</dd></dl>
      <div class="cond mt">${q?`同劑量每日一次可用 q${q}h（濃度降到 &lt;${X.trough} mg/L 所需時間 ≤${q} 小時）`:`超過 48 小時仍未降到 &lt;${X.trough} mg/L：改傳統分次或依濃度給藥`}。</div>
      <div class="onote">公式：K = ln(C1/C2) ÷ 兩次抽血間隔；Cmax = C1 × e^(K ×（t1 − 輸注時間））。trough 目標 ${X.trough} mg/L 依每日一次給藥常用值。</div>${srcTags(["STAN_AG","HHS_AG"])}</div>`;
  }
  return h;
}

// Pugh 1973：bilirubin（mg/dL）、albumin（g/dL）、INR、腹水、肝腦病變各 1–3 分；5–6 A、7–9 B、10–15 C
function cpScore(cp){
  if(cp.mode==="direct") return cp.cls?{cls:cp.cls,direct:true}:null;
  const {bili,alb,inr,asc,enc}=cp;
  if(bili==null||alb==null||inr==null) return null;
  const p=(bili<2?1:bili<=3?2:3)+(alb>3.5?1:alb>=2.8?2:3)+(inr<1.7?1:inr<=2.3?2:3)+(+asc||1)+(+enc||1);
  return {score:p,cls:p<=6?"A":p<=9?"B":"C"};
}

  isavu:{A:"不需調整",B:"不需調整",C:"未研究；效益大於風險才用，監測毒性",src:["ISAVU_SPC"]},
  posa:{A:"不需調整（錠劑）",B:"不需調整（錠劑）",C:"不需調整（錠劑；未專門研究）",x:"口服懸液劑仿單無肝功能劑量建議",src:["POSA_LABEL"]},

function hepHTML(k){

  return `<div class="note"><b>肝功能（Child-Pugh）</b>${now}<div class="tbl-wrap mt"><table><thead><tr><th>分級</th><th>劑量</th></tr></thead><tbody>${rows}</tbody></table></div>${h.x?`<div class="hint">${h.x}</div>`:""}${srcTags(h.src)}</div>`;

function copyText(txt){

}

if(typeof document!=="undefined"){
  $("ver").textContent=`${VERSION}・查證 ${VERIFIED}`;
  $("footVer").textContent=`抗生素選擇助手 ${VERSION}・查證 ${VERIFIED}・${SCOPE}`;
  // 病人資料：值沒變就不重繪（避免 blur 時把正要點的按鈕換掉）
  const ptKey=()=>JSON.stringify([S.pt,S.allergy,S.preg,S.pf,S.cp]);
  const onPt=()=>{ const k=ptKey(); readPt(); if(ptKey()===k) return; renderRsum(); renderMain(); renderPt(); renderPf(); renderCp(); };
  const S_INIT=JSON.parse(JSON.stringify(S));
  // 清除全部：病人卡、PEN-FAST、肝功能、TDM 濃度、用藥調整與口服降階的輸入；保留目前分頁與經驗性治療情境
  function clearAll(){
    ["age","wt","ht","scr","crclIn","egfrIn","cpBili","cpAlb","cpInr"].forEach(id=>{ $(id).value=""; });
    $("sexM").checked=true; document.querySelector('input[name="method"][value="cg"]').checked=true; document.querySelector('input[name="cpmode"][value="calc"]').checked=true;
    ["aki","preg","pf5","pfA","pfS","pfT"].forEach(id=>{ $(id).checked=false; });
    $("allergy").value="none"; $("cpAsc").value="1"; $("cpEnc").value="1"; $("cpCls").value="";
    S.ag=JSON.parse(JSON.stringify(S_INIT.ag)); S.cur=JSON.parse(JSON.stringify(S_INIT.cur)); S.oral=JSON.parse(JSON.stringify(S_INIT.oral));
    UI.mMore=false; readPt(); renderRsum(); renderMain(); renderPt(); renderPf(); renderCp();
    toast("已清除病人資料");
  }
  $("side").addEventListener("input",onPt);
  $("side").addEventListener("change",onPt);
  const showOv=(t,b)=>{ $("ovT").textContent=t; $("ovB").innerHTML=b; $("ov").hidden=false; $("ov").querySelector(".btn").focus(); };
  const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("ov").hidden) $("ov").hidden=true; });
  $("ov").addEventListener("click",e=>{ if(e.target===$("ov")) $("ov").hidden=true; });
  // 出處、更新：點擊開底部彈出層
  document.addEventListener("click",e=>{
    const sb=e.target.closest("button.src[data-ref]");
    if(sb){ const r=REF[sb.dataset.ref]; if(r) showOv(r.s,`<p>${esc(r.f)}</p>`); return; }
    const ub=e.target.closest("button.upd[data-upd]");
    if(ub){ const t=ub.dataset.upd; showOv("更新",`<p>${t&&t!=="1"?esc(t):"與先前版本相比的新建議（2024–2026 指引）。改了什麼請見同一列的說明與出處。"}</p>`); return; }
    const gb=e.target.closest("button.gl[data-gl]");
    if(gb){ const k=gb.dataset.gl; showOv(k,`<p>${esc(GLOSS[k]||"")}</p>`); return; }
  });
  // 搜尋
  const q=$("q");
  q.addEventListener("input",()=>renderQ(q.value));
  q.addEventListener("keydown",e=>{ if(e.key==="Enter"&&QH.length){ e.preventDefault(); $("qres").querySelector(".qitem").click(); } else if(e.key==="Escape"){ q.value=""; renderQ(""); } });
  document.addEventListener("click",e=>{ if(!e.target.closest(".srch")) $("qres").hidden=true; });
  q.addEventListener("focus",()=>{ if(q.value.trim()) renderQ(q.value); });
  let wasNarrow=narrow();
  addEventListener("resize",()=>{ const n=narrow(); if(n!==wasNarrow){ wasNarrow=n; renderPt(); } });
  // TDM 濃度欄位：輸入時更新結果區，不重繪整頁
  $("main").addEventListener("input",e=>{
    if(e.target.dataset.act!=="ag-f") return;
    const f=e.target.dataset.v, x=num(e.target.value);
    S.ag[f]=x!==null&&x>0?x:(f==="ti"?0.5:null);
    const el=$("agRes"); if(el){ el.innerHTML=agResHTML(S.tdm); markGloss(el); }
  });
  $("main").addEventListener("change",e=>{
    const a=e.target.dataset.act; if(!a) return;
    if(a==="mdr"){ const v=e.target.dataset.v; S.mdr=e.target.checked?[...S.mdr,v]:S.mdr.filter(x=>x!==v); renderMain(); }
    else if(a==="cmp-diff"){ S.spec.diff=e.target.checked; renderMain(); }
    else if(a==="cur-day"){ S.cur.day=Math.max(0,num(e.target.value)||0); renderMain(); }
    else if(a==="cur-flag"){ S.cur[e.target.dataset.v]=e.target.checked; renderMain(); }
    else if(a==="o-day"){ S.oral.day=Math.max(0,num(e.target.value)||0); renderMain(); }
    else if(a==="o-flag"){ S.oral[e.target.dataset.v]=e.target.checked; renderMain(); }
    else if(a==="vauc"){ S.vauc=Math.min(600,Math.max(400,num(e.target.value)||500)); renderMain(); }
    else if(a==="vld"){ S.vld=Math.min(35,Math.max(15,num(e.target.value)||25)); renderMain(); }
    else if(a==="ag-f") return;   // 由 input 事件處理
  });
  document.addEventListener("click",e=>{
    const b=e.target.closest("button[data-act]"); if(!b) return;
    const a=b.dataset.act, v=b.dataset.v; let jump=false;
    if(a==="tab"){ S.tab=v; UI.more=false; if(narrow()&&UI.pt){ UI.pt=false; renderPt(); } scrollTo(0,0); }
    else if(a==="more") UI.more=!UI.more;
    else if(a==="pt-open"){ UI.pt=true; renderPt(); if(narrow()){ const el=$("ptBody"); el.scrollIntoView({block:"start"}); const f=$("age"); if(!S.pt.age) f.focus({preventScroll:true}); } return; }
    else if(a==="clear-all"){ clearAll(); return; }
    else if(a==="pt-close"){ UI.pt=false; renderPt(); $("ptBar").focus(); return; }
    else if(a==="m-more"){ UI.mMore=!UI.mMore; renderPt(); return; }
    else if(a==="disc-ok"){ $("disc").hidden=true; $("footDisc").hidden=false; return; }
    else if(a==="ov-close"){ $("ov").hidden=true; return; }
    else if(a==="demo"){ $("age").value=72; $("wt").value=60; $("ht").value=165; $("scr").value=1.6; $("sexM").checked=true; document.querySelector('input[name="method"][value="cg"]').checked=true; readPt(); renderRsum(); renderPt(); toast("已填入範例數值，請改為病人資料"); }
    else if(a==="edit"){ UI.edit=UI.edit===v?null:v; }
    else if(a==="go"){ const x=QH[+b.dataset.i]; if(!x) return; jump=goHit(x); UI.more=false; $("q").value=""; $("qres").hidden=true; if(narrow()&&UI.pt){ UI.pt=false; renderPt(); } if(!jump) scrollTo(0,0); }
    else if(a==="drug"){ S.drug=v; UI.dpick=false; }
    else if(a==="dpick") UI.dpick=!UI.dpick;
    else if(a==="go-drug"){ S.tab="drug"; S.drug=v; UI.dpick=false; scrollTo(0,0); }
    else if(a==="go-tdm"){ S.tab="tdm"; S.tdm=v; scrollTo(0,0); }
    else if(a==="go-sub"){ S.tab="emp"; S.sys=subSys(v); S.sub=v; S.path=null; S.ph=null; UI.edit=null; scrollTo(0,0); }
    else if(a==="tdm") S.tdm=v;
    else if(a==="ag-mode") S.ag.mode=v;
    else if(a==="pf-apply"){ $("allergy").value="pen_low"; readPt(); renderRsum(); renderMain(); renderPt(); renderPf(); toast("已設為 Penicillin 過敏（非嚴重）"); return; }
    else if(a==="onote"){ const n=b.parentElement.nextElementSibling; if(n&&n.classList.contains("onote")){ n.hidden=!n.hidden; b.setAttribute("aria-expanded",String(!n.hidden)); } return; }
    else if(a==="sys"){ const ch=S.sys!==v; S.sys=v; if(ch){ S.sub=SYS[v].def||SYS[v].subs[0].id; S.path=null; S.ph=null; } UI.edit=SYS[v].subs.length>1?"sub":null; }
    else if(a==="sub"){ if(S.sub!==v){ S.sub=v; S.path=null; S.ph=null; } UI.edit=null; }
    else if(a==="sev") S.sev=v;
    else if(a==="path"){ S.path=S.path===v?null:v; S.ph=null; }
    else if(a==="ph") S.ph=v;
    else if(a==="copy"){ copyText(decodeURIComponent(b.dataset.txt)); return; }
    else if(a==="fav-save"){ const f=favs(); f.push({name:scenarioName(),st:{sys:S.sys,sub:S.sub,sev:S.sev,mdr:S.mdr,path:S.path,ph:S.ph}}); saveFavs(f.slice(-12)); toast("已收藏"); }
    else if(a==="fav-load"){ const f=favs()[+b.dataset.i]; if(f) Object.assign(S,f.st); }
    else if(a==="fav-del"){ const f=favs(); f.splice(+b.dataset.i,1); saveFavs(f); }
    else if(a==="cur-drug"){ const c=S.cur.drugs; S.cur.drugs=c.includes(v)?c.filter(x=>x!==v):[...c,v]; }
    else if(a==="cur-resp") S.cur.resp=v;
    else if(a==="cur-org"){ S.cur.org=v; S.cur.ph=""; S.cur.sus={}; }
    else if(a==="cur-ph") S.cur.ph=v;
    else if(a==="cur-sus"){ if(v) S.cur.sus[b.dataset.d]=v; else delete S.cur.sus[b.dataset.d]; }
    else if(a==="proc"){ S.proc=v; UI.pxpick=false; }
    else if(a==="pxpick") UI.pxpick=!UI.pxpick;
    else if(a==="brand"){ const host=b.closest(".rx")||b.parentElement; const sp=host.querySelector(".rx-more"); if(sp){ sp.hidden=!sp.hidden; b.setAttribute("aria-expanded",String(!sp.hidden)); } return; }
    else if(a==="o-iv"){ const c=S.oral.ivs; S.oral.ivs=c.includes(v)?c.filter(x=>x!==v):[...c,v]; }
    else if(a==="o-org"){ S.oral.org=v; S.oral.ph=""; S.oral.sus={}; }
    else if(a==="o-ph") S.oral.ph=v;
    else if(a==="o-sus"){ if(v) S.oral.sus[b.dataset.d]=v; else delete S.oral.sus[b.dataset.d]; }
    else if(a==="spec-view") S.spec.view=v;
    else if(a==="spec-col"){ const i=+v, c=S.spec.cols; S.spec.cols=c.includes(i)?c.filter(x=>x!==i):[...c,i]; S.spec.drug=null; }
    else if(a==="spec-drug"){ S.spec.drug=S.spec.drug===v?null:v; S.spec.cols=[]; jump=true; }
    else if(a==="spec-clear"){ S.spec.cols=[]; S.spec.drug=null; }
    else if(a==="cmp-t"){ S.spec.cmpt=v; S.spec.cell=null; }
    else if(a==="cmp-add"){ const L=S.spec.cmpt==="fun"?"cmpf":"cmp", c=S.spec[L];
      if(c.includes(v)) S.spec[L]=c.filter(x=>x!==v); else if(c.length<4){ S.spec[L]=[...c,v]; const m=S.spec[L].length; if(m===4||(m===2&&UI.cmpPick)) UI.cmpPick=false; }
      S.spec.cell=null; }
    else if(a==="cmp-rm"){ const L=S.spec.cmpt==="fun"?"cmpf":"cmp"; S.spec[L]=S.spec[L].filter(x=>x!==v); S.spec.cell=null; }
    else if(a==="cmp-clear"){ S.spec[S.spec.cmpt==="fun"?"cmpf":"cmp"]=[]; S.spec.cell=null; UI.cmpPick=true; }
    else if(a==="cmp-pick") UI.cmpPick=!UI.cmpPick;
    else if(a==="cmp-cell"){ const [r,k]=v.split("|"); const c=S.spec.cell; S.spec.cell=c&&String(c[0])===r&&c[1]===k?null:[r,k]; jump=!!S.spec.cell; }
    else if(a==="cmp-go"){ const ck=cmpKeyOf(v); if(!ck) return; const L=ck[0]==="fun"?"cmpf":"cmp";
      S.tab="spec"; S.spec.view="cmp"; S.spec.cmpt=ck[0]; S.spec.cell=null;
      if(!S.spec[L].includes(ck[1])){ if(S.spec[L].length>=4) S.spec[L]=S.spec[L].slice(0,3); S.spec[L]=[...S.spec[L],ck[1]]; }
      UI.cmpPick=S.spec[L].length<2; toast(S.spec[L].length<2?"已加入比較，再選一個藥":"已加入比較"); scrollTo(0,0); }
    else if(a==="f-row"){ S.spec.frow=S.spec.frow===+v?null:+v; S.spec.fdrug=null; jump=true; }
    else if(a==="f-drug"){ S.spec.fdrug=S.spec.fdrug===v?null:v; S.spec.frow=null; jump=true; }
    else if(a==="spec-go"){ S.tab="spec"; S.spec.view="bac"; S.spec.cols=[+v]; S.spec.drug=null; jump=true; }
    else if(a==="spec-jump"){ const el=$("specAdv"); if(el) el.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); return; }
    else if(a==="tind"){ S.tind=v; S.tln=v==="std"?3:(v==="ie"?5:4); }
    else if(a==="tln") S.tln=+v;
    else return;
    renderMain();
    if(jump){ const el=$("specAdv"); if(el) el.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); }
  });
  readPt(); renderRsum(); renderMain(); renderPt(); renderPf(); renderCp();
}
</script>

</body>
</html>
